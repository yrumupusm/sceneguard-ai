name: Public text cleanup (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-text-audit.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply text-only changes and verify preserved analysis records
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --quiet "$REVISION"
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          names = [n for n in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if n]
          catalog = json.loads(pathlib.Path('records/catalog.json').read_text())
          registered = set()
          for item in catalog.get('experiments', []):
              for key in ('report_path','review_path','metrics_path','review_binding_path'):
                  if item.get(key): registered.add(item[key])
          frozen = {n for n in names if n.startswith(('records/','sceneguard/','tests/','tests_mvp/','tests_vlm/')) or n in registered}
          frozen |= {n for n in names if n.startswith(('docs/experiments/','docs/reviews/')) and pathlib.Path(n).suffix == '.md' and not n.endswith(('-plan.md','-protocol.md'))}
          before = {n:hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in frozen}
          replacements = {
              'SceneGuard는 AI Software Engineer 직무 포트폴리오를 위한 실험 프로젝트다.':'SceneGuard는 CCTV 경계 통과를 분석하고 근거를 검토하는 실험 프로젝트다.',
              'AI Software Engineer 직무 포트폴리오를 위한 독립 프로젝트.':'CCTV 경계 통과 분석을 위한 독립 프로젝트.',
              '노타 AI Software Engineer 지원을 염두에 둔 SceneGuard는':'SceneGuard는',
              '노타 AI의 영상 관제 솔루션과 가까운 기술 역량을 보여주기 위해,':'고정 CCTV의 경계 통과 분석과 근거 검토를 위해,',
              '노타 AI 영상 관제 직무와 촬영 환경 정합성을 고려해':'영상 관제 목적과 촬영 환경의 정합성을 고려해',
              '노타 AI의 CCTV·영상 관제 분야와 유사한':'CCTV 영상 관제 환경에 가까운',
              '포트폴리오의 기술적 문제해결 깊이를 보여주기':'목표로 한 행동·사건 분석 문제를 검증하기',
              '면접·포트폴리오에 사용할':'기술 검토에 사용할',
              '포트폴리오 페이지 수치':'결과 요약 수치',
              '포트폴리오 지표':'요약 지표',
              '포트폴리오 성공 기준':'프로젝트 완료 기준',
              '포트폴리오 증거 수집 가이드':'개발 근거 정리 가이드',
              '## Phase 5 — 포트폴리오':'## Phase 5 — 결과 정리',
              'PORTFOLIO_EVIDENCE.md':'ENGINEERING_EVIDENCE.md',
          }
          def label(text):
              text = re.sub(r'침입[ \t]*확인[ \t]*(?:[·ㆍ/][ \t]*자동|\([ \t]*자동[ \t]*\))','침입 검출',text)
              text = re.sub(r'침입[ \t]*자동[ \t]*확인','침입 검출',text)
              text = re.sub(r'자동[ \t]*확인','침입 검출',text)
              text = re.sub(r'침입[ \t]*확인','침입 검출',text)
              return text.replace('침입 침입 검출','침입 검출')
          changed = []
          for name in names:
              path = pathlib.Path(name)
              if path.suffix != '.md' or name in frozen: continue
              old = path.read_text(encoding='utf-8')
              new = old
              for a,b in replacements.items(): new = new.replace(a,b)
              new = new.replace('포트폴리오','프로젝트')
              new = label(new)
              if new != old:
                  path.write_text(new, encoding='utf-8'); changed.append(name)
          old_path = pathlib.Path('docs/PORTFOLIO_EVIDENCE.md')
          if old_path.exists(): old_path.rename('docs/ENGINEERING_EVIDENCE.md')
          # Remove the machine-specific font directory name without dropping support
          # for an already installed Malgun font. The explicit --font option remains.
          font = pathlib.Path('scripts/render_new_notice_review.py')
          old = font.read_text(encoding='utf-8')
          needle = "Path('/home/jhc7484/.local/share/fonts/sceneguard-portfolio/malgun.ttf')"
          replacement = "next((p for p in sorted((Path.home() / '.local/share/fonts').glob('sceneguard*/malgun.ttf')) if p.is_file()), Path('/usr/share/fonts/truetype/nanum/NanumGothic.ttf'))"
          if needle in old:
              font.write_text(old.replace(needle,replacement), encoding='utf-8'); changed.append(str(font))
          pathlib.Path('docs/README.md').write_text('''# SceneGuard 문서 안내

          **현재 단계: 1차 MVP — 녹화 영상의 침입 감지와 근거 검수**

          ## 시작하기

          | 문서 | 내용 |
          | --- | --- |
          | [프로젝트 소개](../README.md) | 기능·처리 흐름·평가·로드맵 |
          | [실행 안내](MVP_QUICKSTART.md) | 로컬 환경과 별도 준비 자료 |
          | [웹 검수](WEB_REVIEW_WORKFLOW.md) | 사건·누락 검토 및 답변 반영 흐름 |
          | [개발 근거 정리](ENGINEERING_EVIDENCE.md) | 기술 선택·실험·개선 근거 기록 |

          ## 평가와 보완

          - [초기 전체 평가](MVP_FULL_EVALUATION.md): 45개 영상·공식 사건 52건
          - [감시 영역 보완](experiments/MVP-0006-results.md): 같은 6개 영상의 전후 비교
          - [경계 통과 보완](GATE_OBSERVATION_REVIEW.md): 기본 선택안과 후속 실험 이력
          - [최신 억제안 비교](experiments/EXP-0062-results.md): 비교 결과와 채택 보류 이유

          ## 기술 기록

          [설계 결정](decisions/) · [실험 보고서](experiments/) · [검토 기록](reviews/) · [선행 기술 조사](research/)

          안내 문서와 화면의 상태 이름은 **침입 의심 / 침입 검출 / 의심 해제**로 구분.
          침입 검출은 시스템 판단이며 사용자의 검수 완료와 별개.

          수치·원문 검증을 위한 실험 보고서, 측정값, 내부 상태값과 키는 보존.
          과거 기록을 화면에 표시할 때만 현재 용어로 변환하며, 검수 입력 내용은 변경하지 않음.
          '''.replace('\n          ','\n'), encoding='utf-8')
          pathlib.Path('webapp/terminology.js').write_text(r'''/* Display-only vocabulary. Stored states, API payloads and review input stay intact. */
          (function (root, factory) {
            'use strict';
            const api = factory();
            if (typeof module === 'object' && module.exports) module.exports = api;
            if (typeof document !== 'undefined') {
              root.SceneGuardPublicText = api;
              api.install(document);
            }
          })(globalThis, function () {
            'use strict';
            function text(value) {
              if (typeof value !== 'string') return value;
              return value
                .replace(/침입[ \t]*확인[ \t]*(?:[·ㆍ/][ \t]*자동|\([ \t]*자동[ \t]*\))/g, '침입 검출')
                .replace(/침입[ \t]*자동[ \t]*확인/g, '침입 검출')
                .replace(/자동[ \t]*확인/g, '침입 검출')
                .replace(/침입[ \t]*확인/g, '침입 검출')
                .replace(/침입 침입 검출/g, '침입 검출');
            }
            function skip(node) {
              for (let p = node.nodeType === 1 ? node : node.parentNode; p; p = p.parentNode) {
                if (/^(SCRIPT|STYLE|TEXTAREA|INPUT|CODE|PRE)$/.test(p.tagName || '') || p.isContentEditable) return true;
              }
              return false;
            }
            function visit(node) {
              if (!node || skip(node)) return;
              if (node.nodeType === 3) {
                const next = text(node.nodeValue);
                if (next !== node.nodeValue) node.nodeValue = next;
                return;
              }
              if (node.nodeType === 1 && typeof node.getAttribute === 'function') {
                for (const key of ['title','aria-label']) {
                  const old = node.getAttribute(key);
                  const next = text(old);
                  if (old !== next) node.setAttribute(key, next);
                }
              }
              for (const child of Array.from(node.childNodes || [])) visit(child);
            }
            function install(doc) {
              if (!doc.body) {
                doc.addEventListener('DOMContentLoaded', () => install(doc), {once:true});
                return null;
              }
              visit(doc.body);
              if (typeof MutationObserver === 'undefined') return null;
              const observer = new MutationObserver(records => {
                for (const record of records) {
                  if (record.type === 'childList') {
                    for (const child of record.addedNodes) visit(child);
                  } else visit(record.target);
                }
              });
              observer.observe(doc.body, {subtree:true, childList:true, characterData:true,
                attributes:true, attributeFilter:['title','aria-label']});
              return observer;
            }
            return {text, visit, install};
          });
          '''.replace('\n          ','\n'), encoding='utf-8')
          html = pathlib.Path('webapp/index.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace('</script>', '</script>\n<script defer src="/assets/terminology.js?v=public-v1"></script>', 1)
          text = text.replace('등록된 결과와 아직 결과가 없는 배정을 함께 보여줍니다.', '등록된 실험 결과와 진행 상태')
          text = text.replace('수동 검토는 로컬에 저장됩니다 · 모델 실행이나 승인 기능 없음', '검수 결과는 로컬 저장 · 모델 실행과 별개')
          text = text.replace('영상 분석과 사건 검토', '1차 MVP · 녹화 영상 분석과 사건 검수')
          html.write_text(text, encoding='utf-8')
          app = pathlib.Path('webapp/app.py')
          text = app.read_text(encoding='utf-8')
          needle = "if name not in ('app.js', 'style.css'):"
          assert text.count(needle) == 1
          app.write_text(text.replace(needle,"if name not in ('app.js', 'style.css', 'terminology.js'):"), encoding='utf-8')
          pathlib.Path('tests_orca/test_public_terminology.js').write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const ui = require('../webapp/terminology.js');
          const cases = [
            ['자동 확인','침입 검출'], ['자동확인','침입 검출'],
            ['침입 확인 · 자동','침입 검출'], ['침입 확인(자동)','침입 검출'],
            ['침입 자동 확인','침입 검출'], ['침입 확인','침입 검출'],
            ['침입 의심 / 의심 해제','침입 의심 / 의심 해제'],
            ['automatic_confirmation / confirmation','automatic_confirmation / confirmation']
          ];
          for (const [before, after] of cases) test(before, () => assert.equal(ui.text(before),after));
          test('non-string values and stored records stay unchanged', () => {
            const record = {automatic_confirmation:true,status:'침입 확인',count:37};
            const snapshot = JSON.stringify(record);
            assert.equal(ui.text(record),record);
            assert.equal(ui.text(null),null);
            assert.equal(ui.text(37),37);
            assert.equal(ui.text(record.status),'침입 검출');
            assert.equal(JSON.stringify(record),snapshot);
          });
          function element(tag, children=[]) {
            const node = {nodeType:1,tagName:tag,childNodes:children,attrs:{},
              getAttribute(key){ return this.attrs[key] ?? null; },
              setAttribute(key,value){ this.attrs[key]=value; }};
            for (const child of children) child.parentNode = node;
            return node;
          }
          function txt(value){ return {nodeType:3,nodeValue:value}; }
          test('text and accessibility labels update without rebuilding video nodes', () => {
            const title=txt('자동 확인 24→37건');
            const video=element('VIDEO');video.currentTime=12.5;
            const body=element('BODY',[element('P',[title]),video]);
            body.attrs['aria-label']='침입 확인 · 자동';
            ui.visit(body);ui.visit(body);
            assert.equal(title.nodeValue,'침입 검출 24→37건');
            assert.equal(body.attrs['aria-label'],'침입 검출');
            assert.equal(body.childNodes[1],video);
            assert.equal(video.currentTime,12.5);
          });
          test('review inputs, code and editable text are not rewritten', () => {
            for (const tag of ['TEXTAREA','INPUT','CODE','PRE','SCRIPT','STYLE']) {
              const value=txt('자동 확인');const parent=element(tag,[value]);
              ui.visit(parent);ui.visit(value);
              assert.equal(value.nodeValue,'자동 확인');
            }
            const value=txt('자동 확인');const editable=element('DIV',[value]);
            editable.isContentEditable=true;ui.visit(editable);
            assert.equal(value.nodeValue,'자동 확인');
          });
          '''.replace('\n          ','\n'), encoding='utf-8')
          for name, expected in before.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, 'Protected source changed: '+name
          pattern = re.compile(r'노타|\bnota\b|포트폴리오|portfolio|채용|이력서|입사지원',re.I)
          remaining = []
          for name in names:
              if name.startswith(('.github/','sceneguard/vendor/')): continue
              path=pathlib.Path(name)
              if not path.exists() or path.suffix not in {'.md','.txt','.py','.js','.html','.json','.yaml','.yml'}: continue
              if pattern.search(path.read_text(encoding='utf-8')): remaining.append(name)
          assert not remaining, 'Application-specific text remains: '+repr(remaining)
          print('CHANGED_GUIDES', len(changed))
          print('PROTECTED_FILES_UNCHANGED',len(before))
          print('APPLICATION_TEXT_REMAINING',len(remaining))
          print('PRESENTATION_ONLY: source metrics, historical reports and model/rule code unchanged')
          PY
          node --test tests_orca/test_public_terminology.js
          node --check webapp/terminology.js
          node --check webapp/app.js
          python3 -m py_compile webapp/app.py scripts/render_new_notice_review.py
          git diff --check
          git status --short
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REVISION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.history.md AGENTS.md docs webapp scripts/render_new_notice_review.py tests_orca/test_public_terminology.js
          git diff --cached --quiet && exit 0
          git commit -m 'docs: clean public wording and add non-destructive intrusion display labels'
          printf '#!/bin/sh\ncase "$1" in *Username*) printf x-access-token;; *Password*) printf "%%s" "$GH_TOKEN";; esac\n' > "$RUNNER_TEMP/sceneguard-askpass"
          chmod 700 "$RUNNER_TEMP/sceneguard-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/sceneguard-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/main
          rm -f "$RUNNER_TEMP/sceneguard-askpass"
          git log -1 --format='PUBLISHED_COMMIT %H'
