<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SceneGuard 결과 검토</title>
<link rel="stylesheet" href="/assets/style.css?v=web0003">
<script defer src="/assets/app.js?v=web0003">
</script>
</head>
<body>
<header>
<div class="wrap">
<p class="eyebrow">SCENEGUARD · 로컬 결과 조회</p>
<h1>SceneGuard</h1>
<p>영상 분석과 사건 검토</p>
<p id="status" class="status">연결 상태 확인 중</p>
<nav class="primary-nav" aria-label="주 메뉴">
<a href="#history" data-route="history">실험 이력</a>
<a href="#video-review" data-route="video-review">영상 검수</a>
</nav>
</div>
</header>
<main class="wrap">
<div id="history-page">
<section id="experiment-history">
<div class="section-title"><div><p class="eyebrow">EXPERIMENT LIBRARY</p><h2>실험 이력</h2></div><p>등록된 결과와 아직 결과가 없는 배정을 함께 보여줍니다.</p></div>
<div class="filters">
<label>검색 <input id="experiment-search" type="search" placeholder="실험 번호 또는 제목"></label>
<label>결과 상태 <select id="experiment-status"><option value="all">전체</option><option value="registered">결과 등록</option><option value="pending">결과 미등록</option></select></label>
</div>
<p id="experiment-count" class="muted" aria-live="polite"></p>
<nav id="experiments" class="experiment-grid" aria-label="실험 선택"></nav>
</section>
<article id="detail" aria-live="polite"><p>실험을 선택해 주세요.</p></article>
</div>
<div id="video-review-page" hidden><section id="linked-video" hidden></section><section id="mvp-view"><h2>영상 검수</h2></section></div>
</main>
<footer class="wrap">수동 검토는 로컬에 저장됩니다 · 모델 실행이나 승인 기능 없음</footer>
</body>
</html>
