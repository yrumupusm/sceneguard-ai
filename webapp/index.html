<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SceneGuard 결과 검토</title>
<link rel="stylesheet" href="/assets/style.css">
<script defer src="/assets/app.js">
</script>
</head>
<body>
<header>
<div class="wrap">
<p class="eyebrow">SCENEGUARD · 로컬 결과 조회</p>
<h1>SceneGuard</h1>
<p>영상 분석과 사건 검토</p>
<p id="status" class="status">연결 상태 확인 중</p>
</div>
</header>
<main class="wrap">
<section id="mvp-view"><h2>영상 분석</h2></section>
<details><summary>이전 실험 및 비교 이력</summary>
<section>
<h2>총괄</h2>
<div id="coordinator">
</div>
</section>
<section>
<div class="section-title">
<h2>실험 담당과 결과</h2>
<span>작업 상태와 실험 결과는 별도입니다</span>
</div>
<div id="slots" class="grid">
</div>
<details>
<summary>이번 세팅 작업자 보기</summary>
<div id="workers">
</div>
</details>
</section>
<section id="history">
<h2 id="slot-title">실험 선택</h2>
<p>작업 종료는 실험 성공이나 검토 승인을 의미하지 않습니다.</p>
<nav id="experiments" aria-label="배정 및 보고서 선택">
</nav>
</section>
<article id="detail" aria-live="polite">
<p>보고서를 불러오는 중입니다.</p>
</article>
</details>
</main>
<footer class="wrap">수동 검토는 로컬에 저장됩니다 · 모델 실행이나 승인 기능 없음</footer>
</body>
</html>
